<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>inkmd</title>
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src * data: blob: localfile:; style-src 'self' 'unsafe-inline'; font-src 'self' data:" />
    <link id="theme-css" rel="stylesheet" />
  </head>
  <body>
    <div id="app">
      <aside id="sidebar">
        <div id="side-tabs">
          <button data-panel="files" class="on">文件</button>
          <button data-panel="outline">大纲</button>
          <button id="btn-open-folder" title="打开文件夹"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M3 6.5A1.5 1.5 0 0 1 4.5 5H9l2 2.5h8.5A1.5 1.5 0 0 1 21 9v8.5a1.5 1.5 0 0 1-1.5 1.5h-15A1.5 1.5 0 0 1 3 17.5z"/></svg></button>
        </div>
        <div id="panel-files" class="panel">
          <div id="folder-name">未打开文件夹</div>
          <div id="tree"></div>
        </div>
        <div id="panel-outline" class="panel" hidden><div id="outline"></div></div>
      </aside>
      <section id="content">
        <div id="tabbar"></div>
        <main id="main">
          <div id="editor"></div>
          <textarea id="source" spellcheck="false" hidden></textarea>
        </main>
        <div id="statusbar">
          <button id="btn-sidebar" class="sb-btn" title="切换侧边栏 (Ctrl+Shift+L)"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
          <button id="btn-source" class="sb-btn" title="源码模式 (Ctrl+/)"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 7l-5 5 5 5M16 7l5 5-5 5"/></svg></button>
          <span id="status-path">未命名</span>
          <span id="status-update"></span>
          <span id="status-info"></span>
        </div>
      </section>
    </div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
