appId: com.kxilong.inkmd
productName: inkmd
directories:
  output: release
files:
  - out/**
  - package.json
win:
  target: nsis
fileAssociations:
  - ext: md
    name: Markdown
    description: Markdown File
    role: Editor
  - ext: markdown
    name: Markdown
    role: Editor
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
